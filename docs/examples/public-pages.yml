# Example only: copy this file to the separate public dr-askar/knowledge
# repository as .github/workflows/pages.yml after reviewing _site there.
# It is intentionally stored under docs/ in the private source repository and
# is never executed from this path.
name: Publish reviewed static site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed public repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload root static output
        uses: actions/upload-pages-artifact@v4
        with:
          path: './'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
