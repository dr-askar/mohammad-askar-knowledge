# Build-only workflow for reviewing a release artifact before controlled sync.
name: Build reviewable release artifact

on:
  # Building a release artifact is an explicit human action. Publication occurs
  # only after the artifact is reviewed and synchronized to the public repo.
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping release builds.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build clean release artifact
        run: node tools/build-release.mjs --publish
      - name: Validate release artifact
        run: node tools/validate-release.mjs
      - name: Upload reviewable artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-site
          path: './_site'
          if-no-files-found: error
          retention-days: 14
